# Dependabot — actualizaciones automáticas de dependencias
version: 2
updates:
  # Dependencias Node (package.json)
  - package-ecosystem: npm

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - node
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      auth:
        patterns:
          - "passport*"
          - "jwks-rsa"
          - "class-validator"
          - "class-transformer"
      lint-format:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript*"

  # Actions de GitHub (versiones fijadas por SHA)
  - package-ecosystem: github-actions

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # Imagen base del Dockerfile
  - package-ecosystem: docker

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    groups:
      docker-base:
        patterns:
          - "*"
